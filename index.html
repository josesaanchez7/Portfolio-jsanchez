<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>José Sánchez · Desarrollador de aplicaciones multiplataforma</title>
    <meta
      name="description"
      content="Portfolio de José Sánchez: graduado en Desarrollo de Aplicaciones Multiplataforma y QA Tester. Proyectos, experiencia y contacto."
    />
    <meta name="author" content="José Sánchez" />
    <meta name="theme-color" content="#151923" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="José Sánchez · Desarrollador de aplicaciones multiplataforma" />
    <meta
      property="og:description"
      content="Soluciones eficientes y experiencias digitales modernas. Proyectos, experiencia y contacto."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema guardado antes del primer pintado para evitar parpadeos.
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      } catch (e) {
        // Sin localStorage se mantiene el tema oscuro por defecto.
      }
    </script>
  </head>
  <body class="bg-page font-sans text-base leading-[1.65] text-fg antialiased overflow-x-clip">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
