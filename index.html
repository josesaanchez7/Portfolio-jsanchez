<!doctype html>
<html lang="{{lang}}" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta
      name="description"
      content="{{description}}"
    />
    <meta name="author" content="José Sánchez" />
    <meta name="theme-color" content="#151923" />
    <!-- Open Graph, Twitter, canonical y hreflang: los genera vite-seo-plugin.ts a partir de src/i18n. -->
    {{seo}}
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Precarga de las fuentes del primer pantallazo (subconjunto latino): evita esperar al CSS para descubrirlas. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2" />
    <script>
      // Aplica el tema guardado antes del primer pintado para evitar parpadeos.
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      } catch (e) {
        // Sin localStorage se mantiene el tema oscuro por defecto.
      }
    </script>
  </head>
  <body class="bg-page font-sans text-base leading-[1.65] text-fg antialiased overflow-x-clip">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
